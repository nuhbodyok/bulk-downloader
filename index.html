<!DOCTYPE html>
<html lang="en" class="transition-colors duration-300">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk URL Downloader</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#5D5CDE',
                    }
                }
            }
        }
    </script>
    <style>
        .loader {
            border-top-color: #5D5CDE;
            animation: spinner 0.6s linear infinite;
        }
        @keyframes spinner {
            to {transform: rotate(360deg);}
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.2);
        }
        .dark .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        .dark .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
        }
        .toast-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-width: 400px;
            pointer-events: none;
        }
        .toast {
            pointer-events: auto;
            transition: transform 0.3s ease, opacity 0.3s ease;
            transform: translateX(150%);
            opacity: 0;
        }
        .toast.show {
            transform: translateX(0);
            opacity: 1;
        }
        .preview-container {
            position: relative;
        }
        .media-preview {
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #fff;
            border: 1px solid rgba(0,0,0,0.1);
            border-radius: 4px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            padding: 4px;
            max-width: 300px;
            max-height: 200px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }
        .dark .media-preview {
            background-color: #1a1a1a;
            border-color: rgba(255,255,255,0.1);
        }
        .preview-trigger:hover + .media-preview,
        .media-preview:hover {
            opacity: 1;
            pointer-events: auto;
        }
        .drag-active {
            background-color: rgba(93, 92, 222, 0.1);
        }
        @media (max-width: 640px) {
            .filter-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        .tab-panel {
            transition: opacity 0.2s ease;
        }
        .tab-panel.hidden {
            display: none;
        }
        .kbd {
            display: inline-block;
            padding: 0.125rem 0.375rem;
            font-size: 0.75rem;
            font-weight: 600;
            line-height: 1;
            color: #374151;
            background-color: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 0.25rem;
            box-shadow: 0 1px 0 rgba(0,0,0,0.1);
        }
        .dark .kbd {
            color: #d1d5db;
            background-color: #374151;
            border-color: #4b5563;
        }
        .status-badge {
            transition: all 0.2s ease;
        }
    </style>
    <script>
        (function() {
            if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
<base target="_blank">
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-200 min-h-screen">
    <div id="toastContainer" class="toast-container"></div>

    <div class="container mx-auto p-4 max-w-4xl">
        <header class="text-center mb-6">
            <h1 class="text-3xl font-bold text-primary mb-2">Bulk URL Downloader</h1>
            <p class="text-gray-600 dark:text-gray-400">Download multiple files at once from your list of URLs</p>
            <p class="text-xs text-gray-500 dark:text-gray-500 mt-1">
                <span class="kbd">Ctrl</span>+<span class="kbd">Enter</span> to process &nbsp;|&nbsp; 
                <span class="kbd">Esc</span> to clear
            </p>
        </header>

        <div class="bg-gray-100 dark:bg-gray-800 rounded-lg p-6 shadow-md mb-6">
            <ul class="flex flex-wrap border-b border-gray-200 dark:border-gray-700 mb-4" role="tablist">
                <li class="mr-2">
                    <button id="tab-text" class="tab-btn inline-block py-2 px-4 text-primary active border-b-2 border-primary font-medium" role="tab" aria-selected="true" aria-controls="panel-text">Enter URLs</button>
                </li>
                <li class="mr-2">
                    <button id="tab-file" class="tab-btn inline-block py-2 px-4 text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary font-medium" role="tab" aria-selected="false" aria-controls="panel-file">Upload File</button>
                </li>
                <li class="mr-2">
                    <button id="tab-prefix" class="tab-btn inline-block py-2 px-4 text-gray-500 dark:text-gray-400 hover:text-primary dark:hover:text-primary font-medium" role="tab" aria-selected="false" aria-controls="panel-prefix">Base URL + Paths</button>
                </li>
            </ul>

            <div id="panel-text" class="tab-panel" role="tabpanel" aria-labelledby="tab-text">
                <label for="urlInput" class="block text-sm font-medium mb-2">Enter URLs (one per line)</label>
                <textarea 
                    id="urlInput" 
                    class="w-full h-40 p-3 border border-gray-300 dark:border-gray-700 rounded-md bg-white dark:bg-gray-700 text-base custom-scrollbar focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" 
                    placeholder="https://example.com/file1.pdf&#10;https://example.com/image.jpg&#10;https://example.com/audio.mp3"
                ></textarea>
                <p class="text-xs text-gray-500 dark:text-gray-500 mt-1" id="urlCount">0 URLs entered</p>
            </div>

            <div id="panel-file" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-file">
                <label for="fileInput" class="block text-sm font-medium mb-2">Upload a text file containing URLs (one per line)</label>
                <div class="flex flex-col gap-2">
                    <div id="dropZone" class="border-2 border-dashed border-gray-300 dark:border-gray-700 rounded-md p-6 flex flex-col items-center justify-center text-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10 text-gray-400 mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
                        </svg>
                        <p class="text-sm text-gray-600 dark:text-gray-400 mb-2">Drag and drop a text file here or click to browse</p>
                        <input type="file" id="fileInput" accept=".txt,.csv,.md,.json" class="hidden" />
                        <button 
                            id="browseFilesBtn" 
                            class="px-4 py-2 bg-primary text-white rounded-md hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50 transition-colors"
                        >
                            Browse Files
                        </button>
                    </div>
                    <div id="fileInfo" class="hidden text-sm bg-white dark:bg-gray-700 p-3 rounded-md border border-gray-300 dark:border-gray-600"></div>
                </div>
            </div>

            <div id="panel-prefix" class="tab-panel hidden" role="tabpanel" aria-labelledby="tab-prefix">
                <div class="flex flex-col gap-3">
                    <div>
                        <label for="baseUrlInput" class="block text-sm font-medium mb-2">Base URL</label>
                        <input 
                            type="text" 
                            id="baseUrlInput" 
                            class="w-full p-3 border border-gray-300 dark:border-gray-700 rounded-md bg-white dark:bg-gray-700 text-base focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" 
                            placeholder="https://example.com"
                        />
                    </div>
                    <div>
                        <label for="pathsInput" class="block text-sm font-medium mb-2">Enter Paths (one per line)</label>
                        <textarea 
                            id="pathsInput" 
                            class="w-full h-32 p-3 border border-gray-300 dark:border-gray-700 rounded-md bg-white dark:bg-gray-700 text-base custom-scrollbar focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" 
                            placeholder="/images/file1.jpg&#10;/documents/doc1.pdf&#10;/media/video.mp4"
                        ></textarea>
                    </div>
                    <div>
                        <button 
                            id="combineBtn" 
                            class="px-4 py-2 bg-primary text-white rounded-md hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50 transition-colors"
                        >
                            Combine URLs
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex flex-wrap gap-3 mt-6 items-center">
                <button 
                    id="processBtn" 
                    class="px-4 py-2 bg-primary text-white rounded-md hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50 transition-colors"
                >
                    Process URLs
                </button>
                <button 
                    id="clearBtn" 
                    class="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-opacity-50 transition-colors"
                >
                    Clear All
                </button>

                <div id="downloadControls" class="hidden ml-auto flex flex-wrap gap-2 items-center">
                    <label for="downloadDelay" class="text-sm whitespace-nowrap">Delay (ms):</label>
                    <input 
                        type="number" 
                        id="downloadDelay" 
                        class="w-20 px-2 py-1 border border-gray-300 dark:border-gray-700 rounded-md bg-white dark:bg-gray-700 text-base"
                        value="500"
                        min="100"
                        max="5000"
                        step="100"
                    >
                    <label for="concurrentLimit" class="text-sm whitespace-nowrap ml-2">Concurrent:</label>
                    <input 
                        type="number" 
                        id="concurrentLimit" 
                        class="w-16 px-2 py-1 border border-gray-300 dark:border-gray-700 rounded-md bg-white dark:bg-gray-700 text-base"
                        value="3"
                        min="1"
                        max="10"
                        step="1"
                    >
                    <button 
                        id="downloadAllBtn" 
                        class="px-4 py-2 bg-green-600 text-white rounded-md hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-green-600 focus:ring-opacity-50 transition-colors"
                        disabled
                    >
                        Download All
                    </button>
                </div>
            </div>

            <div class="mt-4 grid md:grid-cols-2 gap-x-6 gap-y-2">
                <div class="flex items-center">
                    <input type="checkbox" id="fixFilenames" class="rounded border-gray-300 text-primary focus:ring-primary" checked>
                    <label for="fixFilenames" class="ml-2 text-sm text-gray-600 dark:text-gray-400">
                        Clean up filenames (remove special characters)
                    </label>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="detectURLs" class="rounded border-gray-300 text-primary focus:ring-primary" checked>
                    <label for="detectURLs" class="ml-2 text-sm text-gray-600 dark:text-gray-400">
                        Auto-detect URLs in pasted text
                    </label>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="validateContent" class="rounded border-gray-300 text-primary focus:ring-primary" checked>
                    <label for="validateContent" class="ml-2 text-sm text-gray-600 dark:text-gray-400">
                        Validate URL accessibility (HEAD request)
                    </label>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="previewMedia" class="rounded border-gray-300 text-primary focus:ring-primary" checked>
                    <label for="previewMedia" class="ml-2 text-sm text-gray-600 dark:text-gray-400">
                        Show media previews where possible
                    </label>
                </div>
            </div>

            <div class="mt-4">
                <details class="bg-white dark:bg-gray-700 rounded-md border border-gray-200 dark:border-gray-600">
                    <summary class="p-3 cursor-pointer text-sm font-medium">File Type Filters</summary>
                    <div class="p-3 pt-0 grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
                        <div class="flex items-center">
                            <input type="checkbox" id="type-all" class="type-filter rounded border-gray-300 text-primary focus:ring-primary" checked data-type="all">
                            <label for="type-all" class="ml-2 text-sm text-gray-600 dark:text-gray-400">All Types</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="type-image" class="type-filter rounded border-gray-300 text-primary focus:ring-primary" data-type="image">
                            <label for="type-image" class="ml-2 text-sm text-gray-600 dark:text-gray-400">Images</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="type-video" class="type-filter rounded border-gray-300 text-primary focus:ring-primary" data-type="video">
                            <label for="type-video" class="ml-2 text-sm text-gray-600 dark:text-gray-400">Videos</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="type-audio" class="type-filter rounded border-gray-300 text-primary focus:ring-primary" data-type="audio">
                            <label for="type-audio" class="ml-2 text-sm text-gray-600 dark:text-gray-400">Audio</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="type-pdf" class="type-filter rounded border-gray-300 text-primary focus:ring-primary" data-type="pdf">
                            <label for="type-pdf" class="ml-2 text-sm text-gray-600 dark:text-gray-400">PDF</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="type-doc" class="type-filter rounded border-gray-300 text-primary focus:ring-primary" data-type="doc">
                            <label for="type-doc" class="ml-2 text-sm text-gray-600 dark:text-gray-400">Documents</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="type-data" class="type-filter rounded border-gray-300 text-primary focus:ring-primary" data-type="data">
                            <label for="type-data" class="ml-2 text-sm text-gray-600 dark:text-gray-400">Data Files</label>
                        </div>
                        <div class="flex items-center">
                            <input type="checkbox" id="type-archive" class="type-filter rounded border-gray-300 text-primary focus:ring-primary" data-type="archive">
                            <label for="type-archive" class="ml-2 text-sm text-gray-600 dark:text-gray-400">Archives</label>
                        </div>
                    </div>
                </details>
            </div>

        <div id="statusContainer" class="mb-6 hidden">
            <h2 class="text-xl font-semibold mb-3">Processing Status</h2>
            <div class="bg-gray-100 dark:bg-gray-800 rounded-lg p-4 shadow-md">
                <div class="flex flex-wrap justify-between mb-2 gap-2">
                    <div>
                        <span id="processedCount">0</span>/<span id="totalCount">0</span> URLs processed
                    </div>
                    <div>
                        <span id="successCount" class="text-green-600 dark:text-green-400">0</span> success, 
                        <span id="errorCount" class="text-red-600 dark:text-red-400">0</span> error,
                        <span id="pendingCount" class="text-blue-600 dark:text-blue-400">0</span> pending
                    </div>
                </div>
                <div class="w-full bg-gray-300 dark:bg-gray-700 rounded-full h-2.5">
                    <div id="progressBar" class="bg-primary h-2.5 rounded-full transition-all duration-300" style="width: 0%"></div>
                </div>
            </div>
        </div>

        <div id="resultsContainer" class="hidden">
            <div class="flex justify-between items-center mb-3">
                <h2 class="text-xl font-semibold">Results</h2>
                <div class="flex gap-2">
                    <button id="copyAllURLs" class="text-sm text-primary hover:underline">Copy All URLs</button>
                    <button id="retryFailedBtn" class="text-sm text-primary hover:underline hidden">Retry Failed</button>
                </div>
            </div>
            <div id="resultsList" class="grid grid-cols-1 gap-2"></div>
        </div>
    </div>

    <script>
        'use strict';

        const CONFIG = {
            MAX_URLS: 1000,
            MAX_FILE_SIZE: 10 * 1024 * 1024,
            VALIDATION_TIMEOUT: 5000,
            MAX_CONCURRENT_VALIDATION: 5,
            MAX_CONCURRENT_DOWNLOADS: 10,
            MIN_DOWNLOAD_DELAY: 100,
            MAX_DOWNLOAD_DELAY: 5000,
            DEFAULT_DOWNLOAD_DELAY: 500,
            TOAST_MAX_COUNT: 5,
            TOAST_DURATION: 3000
        };

        const FILE_TYPE_MAPPINGS = {
            image: ['.jpg', '.jpeg', '.png', '.gif', '.bmp', '.webp', '.svg', '.tiff', '.ico'],
            video: ['.mp4', '.webm', '.ogg', '.mov', '.avi', '.wmv', '.flv', '.mkv', '.m4v'],
            audio: ['.mp3', '.wav', '.ogg', '.m4a', '.flac', '.aac'],
            pdf: ['.pdf'],
            doc: ['.doc', '.docx', '.ppt', '.pptx', '.xls', '.xlsx', '.odt', '.ods', '.odp', '.txt', '.rtf'],
            data: ['.csv', '.json', '.xml', '.yaml', '.yml', '.sql', '.db'],
            archive: ['.zip', '.rar', '.7z', '.tar', '.gz', '.bz2', '.xz']
        };

        const MIME_TYPE_MAPPINGS = {
            'image/': 'image',
            'video/': 'video',
            'audio/': 'audio',
            'application/pdf': 'pdf',
            'application/msword': 'doc',
            'application/vnd.openxmlformats-officedocument': 'doc',
            'application/vnd.ms': 'doc',
            'text/': 'doc',
            'application/json': 'data',
            'application/xml': 'data',
            'application/zip': 'archive',
            'application/x-rar': 'archive',
            'application/x-7z': 'archive',
            'application/x-tar': 'archive',
            'application/gzip': 'archive'
        };

        const state = {
            stats: { total: 0, processed: 0, success: 0, error: 0, pending: 0 },
            validUrls: [],
            failedUrls: [],
            downloadQueue: [],
            concurrentDownloads: 0,
            maxConcurrentDownloads: 3,
            isDownloading: false,
            isProcessing: false,
            urlData: [],
            activeTypeFilters: ['all'],
            toastCount: 0,
            abortController: null
        };

        const elements = {
            urlInput: document.getElementById('urlInput'),
            urlCount: document.getElementById('urlCount'),
            processBtn: document.getElementById('processBtn'),
            clearBtn: document.getElementById('clearBtn'),
            downloadAllBtn: document.getElementById('downloadAllBtn'),
            downloadDelay: document.getElementById('downloadDelay'),
            concurrentLimit: document.getElementById('concurrentLimit'),
            fixFilenames: document.getElementById('fixFilenames'),
            detectURLs: document.getElementById('detectURLs'),
            validateContent: document.getElementById('validateContent'),
            previewMedia: document.getElementById('previewMedia'),
            downloadControls: document.getElementById('downloadControls'),
            statusContainer: document.getElementById('statusContainer'),
            resultsContainer: document.getElementById('resultsContainer'),
            resultsList: document.getElementById('resultsList'),
            processedCount: document.getElementById('processedCount'),
            totalCount: document.getElementById('totalCount'),
            successCount: document.getElementById('successCount'),
            errorCount: document.getElementById('errorCount'),
            pendingCount: document.getElementById('pendingCount'),
            progressBar: document.getElementById('progressBar'),
            copyAllURLs: document.getElementById('copyAllURLs'),
            retryFailedBtn: document.getElementById('retryFailedBtn'),
            toastContainer: document.getElementById('toastContainer'),
            fileInput: document.getElementById('fileInput'),
            browseFilesBtn: document.getElementById('browseFilesBtn'),
            fileInfo: document.getElementById('fileInfo'),
            dropZone: document.getElementById('dropZone'),
            baseUrlInput: document.getElementById('baseUrlInput'),
            pathsInput: document.getElementById('pathsInput'),
            combineBtn: document.getElementById('combineBtn'),
            typeFilters: document.querySelectorAll('.type-filter'),
            tabButtons: document.querySelectorAll('.tab-btn'),
            tabPanels: document.querySelectorAll('.tab-panel')
        };

        // Utility Functions
        function showToast(message, type = 'info') {
            if (state.toastCount >= CONFIG.TOAST_MAX_COUNT) {
                const oldest = elements.toastContainer.firstChild;
                if (oldest) {
                    oldest.classList.remove('show');
                    setTimeout(() => {
                        if (oldest.parentNode) oldest.parentNode.removeChild(oldest);
                        state.toastCount--;
                    }, 300);
                }
            }

            const toast = document.createElement('div');
            toast.className = `toast p-3 rounded shadow-lg text-white ${
                type === 'success' ? 'bg-green-600' : 
                type === 'error' ? 'bg-red-600' : 
                type === 'warning' ? 'bg-yellow-500 text-gray-900' : 'bg-blue-600'
            }`;
            toast.textContent = message;

            elements.toastContainer.appendChild(toast);
            state.toastCount++;

            requestAnimationFrame(() => {
                requestAnimationFrame(() => toast.classList.add('show'));
            });

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => {
                    if (toast.parentNode) {
                        toast.parentNode.removeChild(toast);
                        state.toastCount--;
                    }
                }, 300);
            }, CONFIG.TOAST_DURATION);
        }

        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function isValidUrl(string) {
            if (!string || typeof string !== 'string') return false;
            try {
                const url = new URL(string);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (_) {
                return false;
            }
        }

        function extractUrls(text) {
            if (!text) return [];
            const urlRegex = /(https?:\/\/(?:[\w-]+(?::[\w-]+)?@)?(?:[\w-]+\.)+[\w-]+(?:\:[\d]+)?(?:\/[\w\-./?%&=+~#@!$\'*,;]*)?)/gi;
            const matches = text.match(urlRegex) || [];
            return [...new Set(matches.filter(isValidUrl))];
        }

        function getFilenameFromUrl(url) {
            try {
                const urlObj = new URL(url);
                if (urlObj.protocol === 'data:' || urlObj.protocol === 'blob:') {
                    return generateDefaultFilename(urlObj.hostname);
                }

                let pathname = urlObj.pathname;
                const urlParams = new URLSearchParams(urlObj.search);
                const paramNames = ['file', 'filename', 'name', 'download', 'f'];
                for (const param of paramNames) {
                    const paramValue = urlParams.get(param);
                    if (paramValue) {
                        const decoded = decodeURIComponent(paramValue);
                        if (decoded && !decoded.includes('/') && decoded.includes('.')) {
                            return decoded;
                        }
                    }
                }

                const segments = pathname.split('/').filter(Boolean);
                let lastSegment = segments[segments.length - 1] || '';
                if (!lastSegment) return generateDefaultFilename(urlObj.hostname);

                lastSegment = lastSegment.split('?')[0].split('#')[0];
                try { lastSegment = decodeURIComponent(lastSegment); } catch (e) {}
                if (!lastSegment || lastSegment === '.' || lastSegment === '..') {
                    return generateDefaultFilename(urlObj.hostname);
                }
                return lastSegment;
            } catch (e) {
                return generateDefaultFilename();
            }
        }

        function generateDefaultFilename(hostname) {
            const timestamp = new Date().toISOString().replace(/[:T.-]/g, '').slice(0, 14);
            if (hostname) {
                hostname = hostname.replace(/^www\./, '').split('.')[0];
                return `${hostname}-${timestamp}`;
            }
            return `file-${timestamp}`;
        }

        function sanitizeFilename(filename) {
            if (!filename || typeof filename !== 'string') {
                return generateDefaultFilename();
            }
            let sanitized = filename
                .replace(/[<>:"/\\|?*\x00-\x1f]/g, '-')
                .replace(/\s+/g, '_')
                .replace(/_{2,}/g, '_')
                .replace(/-{2,}/g, '-')
                .replace(/^[._-]+|[._-]+$/g, '')
                .trim();
            if (!sanitized) return generateDefaultFilename();
            const MAX_LENGTH = 200;
            if (sanitized.length > MAX_LENGTH) {
                const ext = sanitized.lastIndexOf('.');
                if (ext > 0 && ext > sanitized.length - 20) {
                    sanitized = sanitized.slice(0, MAX_LENGTH - (sanitized.length - ext)) + sanitized.slice(ext);
                } else {
                    sanitized = sanitized.slice(0, MAX_LENGTH);
                }
            }
            return sanitized;
        }

        function detectFileType(url, contentType) {
            if (!url) return 'unknown';
            const cleanUrl = url.toLowerCase().split('?')[0].split('#')[0];
            const extension = cleanUrl.split('.').pop();
            const fullExtension = `.${extension}`;
            for (const [type, extensions] of Object.entries(FILE_TYPE_MAPPINGS)) {
                if (extensions.includes(fullExtension)) return type;
            }
            if (contentType) {
                const cleanMime = contentType.toLowerCase().split(';')[0].trim();
                for (const [mimePrefix, type] of Object.entries(MIME_TYPE_MAPPINGS)) {
                    if (cleanMime.startsWith(mimePrefix)) return type;
                }
            }
            return 'unknown';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            if (!bytes || isNaN(bytes)) return 'Unknown';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.min(Math.floor(Math.log(bytes) / Math.log(k)), sizes.length - 1);
            return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
        }

        function clamp(num, min, max) {
            return Math.min(Math.max(num, min), max);
        }

        function updateUrlCount() {
            const count = elements.urlInput.value.trim().split('\n').filter(line => line.trim()).length;
            elements.urlCount.textContent = `${count} URL${count === 1 ? '' : 's'} entered`;
        }

        // Tab Management
        function initTabs() {
            elements.tabButtons.forEach(button => {
                button.addEventListener('click', () => {
                    const targetPanel = button.getAttribute('aria-controls');
                    elements.tabButtons.forEach(btn => {
                        const isActive = btn === button;
                        btn.classList.toggle('text-primary', isActive);
                        btn.classList.toggle('border-b-2', isActive);
                        btn.classList.toggle('border-primary', isActive);
                        btn.classList.toggle('text-gray-500', !isActive);
                        btn.classList.toggle('dark:text-gray-400', !isActive);
                        btn.setAttribute('aria-selected', isActive);
                    });
                    elements.tabPanels.forEach(panel => {
                        const isTarget = panel.id === targetPanel;
                        panel.classList.toggle('hidden', !isTarget);
                        if (isTarget) {
                            panel.style.opacity = '0';
                            requestAnimationFrame(() => { panel.style.opacity = '1'; });
                        }
                    });
                });
            });
        }

        // File Upload
        function initFileUpload() {
            elements.browseFilesBtn.addEventListener('click', () => elements.fileInput.click());
            elements.fileInput.addEventListener('change', handleFileSelect);
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                elements.dropZone.addEventListener(eventName, preventDefaults, false);
            });
            ['dragenter', 'dragover'].forEach(eventName => {
                elements.dropZone.addEventListener(eventName, () => elements.dropZone.classList.add('drag-active'), false);
            });
            ['dragleave', 'drop'].forEach(eventName => {
                elements.dropZone.addEventListener(eventName, () => elements.dropZone.classList.remove('drag-active'), false);
            });
            elements.dropZone.addEventListener('drop', handleDrop, false);
        }

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        function handleDrop(e) {
            const file = e.dataTransfer.files[0];
            if (file) processFile(file);
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) processFile(file);
        }

        function processFile(file) {
            if (file.size > CONFIG.MAX_FILE_SIZE) {
                showToast(`File too large. Max is ${formatFileSize(CONFIG.MAX_FILE_SIZE)}`, 'error');
                return;
            }
            const allowedTypes = ['text/plain', 'text/csv', 'application/json', 'text/markdown', 'text/x-markdown'];
            const allowedExtensions = ['.txt', '.csv', '.md', '.json'];
            const fileExtension = '.' + file.name.split('.').pop().toLowerCase();
            if (!allowedTypes.includes(file.type) && !allowedExtensions.includes(fileExtension)) {
                showToast('Invalid file type. Use .txt, .csv, .md, or .json', 'error');
                return;
            }
            const reader = new FileReader();
            reader.onload = function(e) {
                const content = e.target.result;
                displayFileInfo(file);
                const urls = extractUrls(content);
                const lines = content.split('\n').map(line => line.trim()).filter(Boolean);
                const validLines = lines.filter(isValidUrl);
                const finalUrls = validLines.length >= urls.length ? validLines : urls;
                if (finalUrls.length > 0) {
                    elements.urlInput.value = finalUrls.join('\n');
                    updateUrlCount();
                    showToast(`Found ${finalUrls.length} URL${finalUrls.length === 1 ? '' : 's'}`, 'success');
                    switchToTab('tab-text');
                } else {
                    showToast('No valid URLs found', 'warning');
                }
            };
            reader.onerror = () => showToast('Error reading file', 'error');
            reader.readAsText(file);
        }

        function displayFileInfo(file) {
            elements.fileInfo.innerHTML = `
                <div class="flex items-center justify-between">
                    <div>
                        <span class="font-medium">${escapeHtml(file.name)}</span> 
                        <span class="text-gray-500 dark:text-gray-400">(${formatFileSize(file.size)})</span>
                    </div>
                    <button id="clearFileBtn" class="text-gray-500 hover:text-red-500 dark:text-gray-400 dark:hover:text-red-400" aria-label="Clear file">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                            <path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            `;
            elements.fileInfo.classList.remove('hidden');
            document.getElementById('clearFileBtn').addEventListener('click', clearFile);
        }

        function clearFile() {
            elements.fileInfo.classList.add('hidden');
            elements.fileInfo.innerHTML = '';
            elements.fileInput.value = '';
        }

        function switchToTab(tabId) {
            document.getElementById(tabId).click();
        }

        // URL Combination
        function initCombine() {
            elements.combineBtn.addEventListener('click', () => {
                const baseUrl = elements.baseUrlInput.value.trim();
                const paths = elements.pathsInput.value.trim().split('\n').filter(p => p.trim());
                if (!baseUrl) { showToast('Please enter a base URL', 'error'); return; }
                if (paths.length === 0) { showToast('Please enter at least one path', 'error'); return; }
                try {
                    const baseUrlObj = new URL(baseUrl);
                    const normalizedBase = baseUrlObj.origin;
                    const combined = paths.map(path => {
                        const normalizedPath = path.trim().startsWith('/') ? path.trim() : `/${path.trim()}`;
                        return `${normalizedBase}${normalizedPath}`;
                    });
                    elements.urlInput.value = combined.join('\n');
                    updateUrlCount();
                    switchToTab('tab-text');
                    showToast(`Created ${combined.length} URLs`, 'success');
                } catch (error) {
                    showToast('Invalid base URL format', 'error');
                }
            });
        }

        // Paste Handling
        function initPasteHandling() {
            elements.urlInput.addEventListener('paste', (e) => {
                if (!elements.detectURLs.checked) return;
                const pastedText = e.clipboardData.getData('text');
                if (!pastedText) return;
                const lines = pastedText.trim().split('\n');
                const allLinesAreUrls = lines.every(line => isValidUrl(line.trim()));
                if (allLinesAreUrls) return;
                const urls = extractUrls(pastedText);
                if (urls.length > 0) {
                    e.preventDefault();
                    const current = elements.urlInput.value;
                    const separator = current.trim() && !current.endsWith('\n') ? '\n' : '';
                    elements.urlInput.value = current + separator + urls.join('\n');
                    updateUrlCount();
                    showToast(`Extracted ${urls.length} URL${urls.length === 1 ? '' : 's'}`, 'success');
                }
            });
            elements.urlInput.addEventListener('input', updateUrlCount);
        }

        // Filters
        function initFilters() {
            elements.typeFilters.forEach(filter => {
                filter.addEventListener('change', handleFilterChange);
            });
        }

        function handleFilterChange(e) {
            const filterType = e.target.dataset.type;
            const isChecked = e.target.checked;
            if (filterType === 'all') {
                if (isChecked) {
                    state.activeTypeFilters = ['all'];
                    elements.typeFilters.forEach(filter => {
                        if (filter.dataset.type !== 'all') filter.checked = false;
                    });
                } else {
                    e.target.checked = true;
                    return;
                }
            } else {
                if (isChecked) {
                    document.getElementById('type-all').checked = false;
                    state.activeTypeFilters = state.activeTypeFilters.filter(t => t !== 'all');
                    if (!state.activeTypeFilters.includes(filterType)) state.activeTypeFilters.push(filterType);
                } else {
                    state.activeTypeFilters = state.activeTypeFilters.filter(t => t !== filterType);
                    if (state.activeTypeFilters.length === 0) {
                        const allFilter = document.getElementById('type-all');
                        allFilter.checked = true;
                        state.activeTypeFilters = ['all'];
                        allFilter.dispatchEvent(new Event('change'));
                    }
                }
            }
            filterResults();
        }

        function filterResults() {
            const cards = elements.resultsList.querySelectorAll('[data-url]');
            const showAll = state.activeTypeFilters.includes('all');
            cards.forEach(card => {
                const url = decodeURIComponent(card.getAttribute('data-url'));
                const dataItem = state.urlData.find(item => item.url === url);
                if (showAll || (dataItem && state.activeTypeFilters.includes(dataItem.fileType))) {
                    card.style.display = '';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        // Stats
        function updateStatsDisplay() {
            elements.processedCount.textContent = state.stats.processed;
            elements.totalCount.textContent = state.stats.total;
            elements.successCount.textContent = state.stats.success;
            elements.errorCount.textContent = state.stats.error;
            elements.pendingCount.textContent = state.stats.pending;
            const percentage = state.stats.total > 0 ? (state.stats.processed / state.stats.total) * 100 : 0;
            elements.progressBar.style.width = `${percentage}%`;
        }

        function resetState() {
            state.stats = { total: 0, processed: 0, success: 0, error: 0, pending: 0 };
            state.validUrls = [];
            state.failedUrls = [];
            state.downloadQueue = [];
            state.concurrentDownloads = 0;
            state.isDownloading = false;
            state.isProcessing = false;
            state.urlData = [];
            if (state.abortController) {
                state.abortController.abort();
                state.abortController = null;
            }
            elements.downloadAllBtn.disabled = true;
            elements.retryFailedBtn.classList.add('hidden');
            updateStatsDisplay();
            elements.resultsList.innerHTML = '';
            elements.statusContainer.classList.add('hidden');
            elements.resultsContainer.classList.add('hidden');
            elements.downloadControls.classList.add('hidden');
        }

        // URL Processing
        async function processUrls() {
            if (state.isProcessing) {
                showToast('Already processing', 'warning');
                return;
            }
            const activeTab = document.querySelector('.tab-btn[aria-selected="true"]').getAttribute('aria-controls');
            let urls = [];
            if (activeTab === 'panel-prefix') {
                elements.combineBtn.click();
                await new Promise(resolve => setTimeout(resolve, 100));
            }
            urls = elements.urlInput.value.trim().split('\n').map(url => url.trim()).filter(url => url !== '');
            if (urls.length === 0) { showToast('Please enter URLs', 'error'); return; }
            if (urls.length > CONFIG.MAX_URLS) {
                showToast(`Max ${CONFIG.MAX_URLS} URLs allowed`, 'error');
                return;
            }
            state.isProcessing = true;
            state.abortController = new AbortController();
            elements.processBtn.disabled = true;
            elements.processBtn.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-4 w-4 text-white inline" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Processing...
            `;
            const fixedUrls = [];
            const skipped = [];
            urls.forEach((url, index) => {
                if (isValidUrl(url)) {
                    fixedUrls.push(url);
                } else if (url.startsWith('www.')) {
                    const fixed = 'https://' + url;
                    if (isValidUrl(fixed)) fixedUrls.push(fixed);
                    else skipped.push(index + 1);
                } else {
                    skipped.push(index + 1);
                }
            });
            if (skipped.length > 0) {
                showToast(`Skipped ${skipped.length} invalid at lines: ${skipped.join(', ')}`, 'warning');
            }
            if (fixedUrls.length === 0) {
                showToast('No valid URLs', 'error');
                cleanupProcessing();
                return;
            }
            resetState();
            state.stats.total = fixedUrls.length;
            updateStatsDisplay();
            elements.statusContainer.classList.remove('hidden');
            elements.resultsContainer.classList.remove('hidden');
            elements.downloadControls.classList.remove('hidden');
            const batchSize = CONFIG.MAX_CONCURRENT_VALIDATION;
            for (let i = 0; i < fixedUrls.length; i += batchSize) {
                if (state.abortController.signal.aborted) break;
                const batch = fixedUrls.slice(i, i + batchSize);
                await Promise.allSettled(batch.map(url => processSingleUrl(url)));
            }
            if (state.validUrls.length > 0) elements.downloadAllBtn.disabled = false;
            if (state.failedUrls.length > 0) elements.retryFailedBtn.classList.remove('hidden');
            cleanupProcessing();
            if (state.validUrls.length > 0) {
                showToast(`Done: ${state.stats.success} valid, ${state.stats.error} failed`, 'info');
            }
        }

        function cleanupProcessing() {
            state.isProcessing = false;
            elements.processBtn.disabled = false;
            elements.processBtn.textContent = 'Process URLs';
        }

        async function processSingleUrl(url) {
            const cardId = `card-${Date.now()}-${Math.random().toString(36).substr(2, 9)}`;
            const resultCard = document.createElement('div');
            resultCard.id = cardId;
            resultCard.className = 'bg-white dark:bg-gray-800 rounded-lg shadow-sm p-3 border border-gray-200 dark:border-gray-700 flex flex-wrap items-center justify-between gap-2';
            resultCard.setAttribute('data-url', encodeURIComponent(url));
            const urlDisplay = document.createElement('div');
            urlDisplay.className = 'text-sm font-medium break-all flex-1 min-w-0';
            urlDisplay.textContent = url;
            const statusElement = document.createElement('div');
            statusElement.className = 'flex items-center text-sm shrink-0 status-badge';
            statusElement.innerHTML = `
                <div class="mr-2 h-4 w-4 rounded-full border-2 border-primary border-t-transparent loader"></div>
                <span>Validating...</span>
            `;
            resultCard.appendChild(urlDisplay);
            resultCard.appendChild(statusElement);
            elements.resultsList.appendChild(resultCard);
            state.stats.pending++;
            updateStatsDisplay();
            try {
                if (!isValidUrl(url)) throw new Error('Invalid URL format');
                let filename = getFilenameFromUrl(url);
                if (elements.fixFilenames.checked) filename = sanitizeFilename(filename);
                let fileType = 'unknown';
                let contentType = '';
                let contentLength = 0;
                if (elements.validateContent.checked) {
                    try {
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), CONFIG.VALIDATION_TIMEOUT);
                        let response;
                        try {
                            response = await fetch(url, { method: 'HEAD', signal: controller.signal, redirect: 'follow' });
                        } catch (corsError) {
                            response = await fetch(url, { method: 'HEAD', signal: controller.signal, mode: 'no-cors', redirect: 'follow' });
                        }
                        clearTimeout(timeoutId);
                        if (response.type === 'opaque' || response.type === 'opaqueredirect') {
                            fileType = detectFileType(url);
                        } else if (response.ok) {
                            contentType = response.headers.get('content-type') || '';
                            contentLength = parseInt(response.headers.get('content-length')) || 0;
                            fileType = detectFileType(url, contentType);
                        } else {
                            throw new Error(`Server returned ${response.status}`);
                        }
                    } catch (error) {
                        if (error.name === 'AbortError') throw new Error('Validation timed out');
                        fileType = detectFileType(url);
                    }
                } else {
                    fileType = detectFileType(url);
                }
                const urlInfo = { url, filename, contentType, contentLength, fileType, status: 'valid', timestamp: Date.now(), cardId };
                state.urlData.push(urlInfo);
                state.validUrls.push(url);
                buildSuccessCard(resultCard, statusElement, urlInfo);
                state.stats.success++;
                state.stats.pending--;
            } catch (error) {
                const errorMsg = error.message || 'Unknown error';
                statusElement.innerHTML = `
                    <span class="text-red-600 dark:text-red-400 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                        ${escapeHtml(errorMsg)}
                    </span>
                `;
                state.failedUrls.push(url);
                state.urlData.push({ url, status: 'error', error: errorMsg, fileType: 'unknown', timestamp: Date.now(), cardId });
                state.stats.error++;
                state.stats.pending--;
            } finally {
                state.stats.processed++;
                updateStatsDisplay();
                filterResults();
            }
        }

        function buildSuccessCard(card, statusElement, urlInfo) {
            statusElement.innerHTML = `
                <span class="text-green-600 dark:text-green-400 flex items-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                    </svg>
                    Valid
                </span>
            `;
            if (urlInfo.fileType !== 'unknown') {
                const badge = document.createElement('span');
                badge.className = 'text-xs px-2 py-1 rounded-full bg-gray-200 dark:bg-gray-700 text-gray-700 dark:text-gray-300 mr-2';
                badge.textContent = urlInfo.fileType;
                card.insertBefore(badge, statusElement);
                card.setAttribute('data-type', urlInfo.fileType);
            }
            if (urlInfo.contentLength > 0) {
                const sizeSpan = document.createElement('span');
                sizeSpan.className = 'text-xs text-gray-500 dark:text-gray-400 mr-2';
                sizeSpan.textContent = formatFileSize(urlInfo.contentLength);
                card.insertBefore(sizeSpan, statusElement);
            }
            const actionContainer = document.createElement('div');
            actionContainer.className = 'flex items-center gap-2';
            const downloadBtn = document.createElement('button');
            downloadBtn.className = 'px-3 py-1 bg-primary text-white text-sm rounded hover:bg-opacity-90 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-50 transition-colors';
            downloadBtn.textContent = 'Download';
            downloadBtn.onclick = () => downloadSingle(urlInfo);
            actionContainer.appendChild(downloadBtn);
            if (elements.previewMedia.checked && ['image', 'video', 'audio'].includes(urlInfo.fileType)) {
                const previewContainer = createPreview(urlInfo);
                if (previewContainer) actionContainer.appendChild(previewContainer);
            }
            statusElement.appendChild(actionContainer);
        }

        function createPreview(urlInfo) {
            const container = document.createElement('div');
            container.className = 'preview-container';
            const trigger = document.createElement('button');
            trigger.className = 'preview-trigger text-blue-500 hover:text-blue-700 dark:text-blue-400 dark:hover:text-blue-300';
            trigger.setAttribute('aria-label', 'Preview media');
            trigger.innerHTML = `
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M10 12a2 2 0 100-4 2 2 0 000 4z" />
                    <path fill-rule="evenodd" d="M.458 10C1.732 5.943 5.522 3 10 3s8.268 2.943 9.542 7c-1.274 4.057-5.064 7-9.542 7S1.732 14.057.458 10zM14 10a4 4 0 11-8 0 4 4 0 018 0z" clip-rule="evenodd" />
                </svg>
            `;
            const preview = document.createElement('div');
            preview.className = 'media-preview';
            if (urlInfo.fileType === 'image') {
                const img = document.createElement('img');
                img.src = urlInfo.url;
                img.alt = escapeHtml(urlInfo.filename);
                img.className = 'max-w-full max-h-full';
                img.onerror = function() {
                    this.onerror = null;
                    this.src = 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22%23ccc%22%3E%3Cpath d=%22M5 3h14c1.1 0 2 .9 2 2v14c0 1.1-.9 2-2 2H5c-1.1 0-2-.9-2-2V5c0-1.1.9-2 2-2zm0 2v14h14V5H5zm4 2h2v2H9zm4 0h2v2h-2zm4 0h2v2h-2zM9 9h2v2H9zm4 0h2v2h-2zm4 0h2v2h-2z%22/%3E%3C/svg%3E';
                    this.alt = 'Preview not available';
                };
                preview.appendChild(img);
            } else if (urlInfo.fileType === 'video') {
                preview.innerHTML = `<div class="p-2 text-sm text-center text-gray-600 dark:text-gray-400">Video preview not available<br><span class="text-xs">(CORS restricted)</span></div>`;
            } else if (urlInfo.fileType === 'audio') {
                preview.innerHTML = `<div class="p-2 text-sm text-center text-gray-600 dark:text-gray-400">Audio preview not available<br><span class="text-xs">(CORS restricted)</span></div>`;
            }
            container.appendChild(trigger);
            container.appendChild(preview);
            return container;
        }

        // Download Management
        function downloadSingle(urlInfo) {
            const card = document.getElementById(urlInfo.cardId);
            if (!card) return;
            const statusElement = card.querySelector('.status-badge');
            if (statusElement) {
                statusElement.innerHTML = `
                    <span class="text-blue-500 dark:text-blue-400 flex items-center">
                        <svg class="animate-spin h-4 w-4 mr-1" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        Downloading...
                    </span>
                `;
            }
            attemptDownload(urlInfo, statusElement);
        }

        async function attemptDownload(urlInfo, statusElement) {
            try {
                const response = await fetch(urlInfo.url, { method: 'GET', mode: 'cors' });
                if (response.ok) {
                    const blob = await response.blob();
                    const blobUrl = URL.createObjectURL(blob);
                    const link = document.createElement('a');
                    link.href = blobUrl;
                    link.download = urlInfo.filename;
                    link.style.display = 'none';
                    document.body.appendChild(link);
                    link.click();
                    setTimeout(() => {
                        if (link.parentNode) document.body.removeChild(link);
                        URL.revokeObjectURL(blobUrl);
                    }, 100);
                    updateDownloadStatus(statusElement, 'success');
                    return;
                }
            } catch (corsError) {
                // CORS blocked, fall through
            }
            const link = document.createElement('a');
            link.href = urlInfo.url;
            link.download = urlInfo.filename;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.style.display = 'none';
            document.body.appendChild(link);
            try {
                link.click();
                updateDownloadStatus(statusElement, 'success');
            } catch (e) {
                updateDownloadStatus(statusElement, 'error');
            }
            setTimeout(() => {
                if (link.parentNode) document.body.removeChild(link);
            }, 100);
        }

        function updateDownloadStatus(statusElement, status) {
            if (!statusElement) return;
            if (status === 'success') {
                statusElement.innerHTML = `
                    <span class="text-green-600 dark:text-green-400 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                        </svg>
                        Downloaded
                    </span>
                `;
            } else {
                statusElement.innerHTML = `
                    <span class="text-red-600 dark:text-red-400 flex items-center">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                        </svg>
                        Download failed
                    </span>
                `;
            }
            setTimeout(() => {
                if (statusElement) {
                    statusElement.innerHTML = `
                        <span class="text-green-600 dark:text-green-400 flex items-center">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                            </svg>
                            Valid
                        </span>
                    `;
                }
            }, 3000);
        }

        function downloadAll() {
            if (state.validUrls.length === 0 || state.isDownloading) return;
            const delay = clamp(parseInt(elements.downloadDelay.value) || CONFIG.DEFAULT_DOWNLOAD_DELAY, 
                               CONFIG.MIN_DOWNLOAD_DELAY, CONFIG.MAX_DOWNLOAD_DELAY);
            const maxConcurrent = clamp(parseInt(elements.concurrentLimit.value) || 3, 1, CONFIG.MAX_CONCURRENT_DOWNLOADS);
            state.maxConcurrentDownloads = maxConcurrent;
            state.downloadQueue = state.validUrls.map(url => state.urlData.find(item => item.url === url)).filter(Boolean);
            state.isDownloading = true;
            state.concurrentDownloads = 0;
            const estimatedTime = Math.ceil((delay * state.downloadQueue.length) / maxConcurrent / 1000);
            showToast(`Starting ${state.downloadQueue.length} downloads. Est: ${estimatedTime}s`, 'info');
            processNextDownloads(delay);
        }

        async function processNextDownloads(delay) {
            if (state.downloadQueue.length === 0) {
                if (state.concurrentDownloads === 0) {
                    state.isDownloading = false;
                    showToast('All downloads initiated!', 'success');
                }
                return;
            }
            while (state.concurrentDownloads < state.maxConcurrentDownloads && state.downloadQueue.length > 0) {
                const urlInfo = state.downloadQueue.shift();
                state.concurrentDownloads++;
                downloadSingle(urlInfo);
                if (state.downloadQueue.length > 0) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                }
            }
            if (state.downloadQueue.length === 0 && state.concurrentDownloads === 0) {
                state.isDownloading = false;
                showToast('All downloads initiated!', 'success');
            }
        }

        // Event Handlers
        function initEventHandlers() {
            elements.processBtn.addEventListener('click', processUrls);
            elements.clearBtn.addEventListener('click', () => {
                resetState();
                elements.urlInput.value = '';
                updateUrlCount();
                showToast('Cleared all data', 'info');
            });
            elements.downloadAllBtn.addEventListener('click', downloadAll);
            elements.copyAllURLs.addEventListener('click', () => {
                const allUrls = state.urlData.map(item => item.url).join('\n');
                navigator.clipboard.writeText(allUrls)
                    .then(() => showToast('All URLs copied', 'success'))
                    .catch(() => showToast('Failed to copy', 'error'));
            });
            elements.retryFailedBtn.addEventListener('click', async () => {
                if (state.failedUrls.length === 0) return;
                const urlsToRetry = [...state.failedUrls];
                state.failedUrls = [];
                state.stats.total += urlsToRetry.length;
                state.stats.pending += urlsToRetry.length;
                updateStatsDisplay();
                const batchSize = CONFIG.MAX_CONCURRENT_VALIDATION;
                for (let i = 0; i < urlsToRetry.length; i += batchSize) {
                    const batch = urlsToRetry.slice(i, i + batchSize);
                    await Promise.allSettled(batch.map(url => processSingleUrl(url)));
                }
                if (state.validUrls.length > 0) elements.downloadAllBtn.disabled = false;
                if (state.failedUrls.length > 0) elements.retryFailedBtn.classList.remove('hidden');
                else elements.retryFailedBtn.classList.add('hidden');
            });

            // Input validation for numeric inputs
            elements.downloadDelay.addEventListener('change', () => {
                elements.downloadDelay.value = clamp(parseInt(elements.downloadDelay.value) || CONFIG.DEFAULT_DOWNLOAD_DELAY, 
                                                     CONFIG.MIN_DOWNLOAD_DELAY, CONFIG.MAX_DOWNLOAD_DELAY);
            });
            elements.concurrentLimit.addEventListener('change', () => {
                elements.concurrentLimit.value = clamp(parseInt(elements.concurrentLimit.value) || 3, 1, CONFIG.MAX_CONCURRENT_DOWNLOADS);
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey) && !elements.processBtn.disabled) {
                    e.preventDefault();
                    processUrls();
                }
                if (e.key === 'Escape' && !state.isProcessing) {
                    resetState();
                    elements.urlInput.value = '';
                    updateUrlCount();
                }
            });
        }

        // Initialize
        function init() {
            initTabs();
            initFileUpload();
            initCombine();
            initPasteHandling();
            initFilters();
            initEventHandlers();
            updateUrlCount();
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
